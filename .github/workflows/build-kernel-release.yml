name: Build and Release OnePlus Kernels

run-name: >-
  ${{ github.event.inputs.op_target_model != '' && github.event.inputs.op_target_model || github.event.inputs.op_model }}
  • SUKISU
  • ${{ github.event.inputs.build_timestamp != '' && github.event.inputs.build_timestamp || 'auto timestamp' }}

permissions:
  contents: write
  actions: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.inputs.make_release == 'true' && 'release' || 'test' }}-${{ github.ref
    }}-${{ github.event.inputs.op_target_model || github.event.inputs.op_model }}
  cancel-in-progress: ${{ github.event.inputs.make_release != 'true' }}

on:
  push:
    branches:
      - codex-compat-smoke
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: false
      op_model:
        description: 'Select the OnePlus kernels to build'
        required: true
        type: choice
        options:
          - A14+15+16
          - A15+16
          - A14+15
          - A16
          - A15
          - A14
          - android16-6.12
          - android15-6.6
          - android14-6.1
          - android13-5.15
          - android12-5.10
        default: A14+15+16
      op_target_model:
        description: 'Optional exact/prefix model: OP12, OP13-CPH, OP-NORD-4, OP12-6.1.118. Case-sensitive. Empty = all.'
        required: false
        type: string
        default: ''
      ksu_options:
        description: 'Enter SukiSU build json (default is the verified builtin commit)'
        required: true
        type: string
        default: '[{"type":"SUKISU","hash":"b20dee702035af09cb2ecb5f35443bbc1747f3e6"}]'
      optimize_level:
        description: "Compiler optimization level"
        required: true
        type: choice
        options: [O2, O3]
        default: O2
      build_timestamp:
        description: 'Custom kernel build timestamp for uname -a (e.g. "Fri Dec 5 02:05:55 UTC 2025"). Leave empty for current time.'
        type: string
        default: ''
      mirror_toolchains:
        description: 'Force toolchain sync before build — REQUIRED on the first run to populate the toolchain cache (auto-on for releases; ~99% of later test runs do not need it)'
        required: false
        type: boolean
        default: false
      clean_build:
        description: 'Clean build (no ccache)'
        type: boolean
        default: false
      debug:
        description: 'Enable debug mode: dumping debug related artifacts and show some debug logs'
        required: false
        type: boolean
        default: false
      enable_adios:
        description: 'Enable ADIOS I/O scheduler support (5.10/5.15/6.1/6.6/6.12 kernels)'
        required: false
        type: boolean
        default: false
      patches_ref:
        description: 'kernel_patches branch/ref for optional performance and compatibility patches'
        required: false
        type: string
        default: main

jobs:
  set-op-model:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      device_count: ${{ steps.set-matrix.outputs.count }}
      active_gki_keys: ${{ steps.set-matrix.outputs.active_gki_keys }}
      ksu_resolved_hash:    ${{ steps.set-matrix.outputs.ksu_resolved_hash }}
      ksu_options_normalized: ${{ steps.set-matrix.outputs.ksu_options_normalized }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_HTTP_TIMEOUT: 600
    steps:
      - name: 📥 Checkout Code (to access configs/)
        uses: actions/checkout@v6

      - name: 🔍 Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Matrix generation"
          
          input="${{ github.event.inputs.op_model }}"
          target_model="${{ github.event.inputs.op_target_model }}"
          ksu_options_raw='${{ github.event.inputs.ksu_options }}'
          if [ "${{ github.event_name }}" = push ]; then
            input="A14+15+16"
            target_model=""
            ksu_options_raw='[{"type":"SUKISU","hash":"b20dee702035af09cb2ecb5f35443bbc1747f3e6"}]'
          fi
          if ! ksu_options_normalized=$(echo "$ksu_options_raw" | jq -c 'map(if .type then .type |= ascii_upcase | if .hash == null or .hash == "" then .hash = "b20dee702035af09cb2ecb5f35443bbc1747f3e6" else . end else error("No type found") end)' 2>&1); then
            echo "::error::ksu_options validation failed: $ksu_options_normalized"
            exit 1
          fi
          if [ "$(echo "$ksu_options_normalized" | jq -r 'length > 0 and all(.[]; .type == "SUKISU")')" != true ]; then
            echo "::error::Only SUKISU entries are supported, and at least one entry is required"
            exit 1
          fi
          
          echo "ksu_options_normalized=$ksu_options_normalized" >> $GITHUB_OUTPUT
          
          echo "[" > matrix.json
          mapfile -t all_json_files < <(find configs/ -name "*.json" -print0 | xargs -0 -n1)
          for i in "${!all_json_files[@]}"; do
            file="${all_json_files[$i]}"
            if [ -f "$file" ]; then
              jq -r '.' "$file" >> matrix.json
              if [ $((i+1)) -lt ${#all_json_files[@]} ]; then
                echo "," >> matrix.json
              fi
            fi
          done
          echo "]" >> matrix.json
          
          jq_filter="."
          
          case "$input" in
            A14+15+16)
              ;;
            A15+16)
              jq_filter="map(select(.os_version == \"A15\" or .os_version == \"A16\"))"
              ;;
            A14+15)
              jq_filter="map(select(.os_version == \"A14\" or .os_version == \"A15\"))"
              ;;
            A16)
              jq_filter="map(select(.os_version == \"A16\"))"
              ;;
            A15)
              jq_filter="map(select(.os_version == \"A15\"))"
              ;;
            A14)
              jq_filter="map(select(.os_version == \"A14\"))"
              ;;
            android*-*.*)
              IFS='-' read -r av kv <<< "$input"
              
              jq_filter="map(select(.android_version == \"$av\" and .kernel_version == \"$kv\"))"
              
              echo "ℹ️  Android-Kernel filter applied: $av-$kv"
              echo "   Matching all restored OS groups: A14, A15 and A16"
              ;;
            *)
              echo "::warning::Unknown input '$input'. Using empty filter."
              jq_filter="map(select(false))"
              ;;
          esac
          
          filtered=$(jq -c "$jq_filter" matrix.json)

          if [ "${{ github.event_name }}" = push ]; then
            smoke_targets='["OP-ACE-RACE-5.10.209","OP-NORD-CE-5","OP15"]'
            echo "🧪 Compatibility smoke targets: $smoke_targets"
            filtered=$(echo "$filtered" | jq -c --argjson targets "$smoke_targets" '
              map(select(.model as $model | $targets | index($model)))
            ')
          elif [ -n "$target_model" ]; then
            echo "🎯 Target model filter enabled: $target_model"
            echo "   Matching exact model OR versioned model prefix."
            filtered=$(echo "$filtered" | jq -c --arg target "$target_model" '
              map(select(.model == $target or (.model | startswith($target + "-"))))
            ')
          else
            echo "ℹ️  No target model selected. Building all configs matching op_model='$input'."
          fi

          count=$(jq 'length' <<<"$filtered")
          
          filtered=$(echo "$filtered" | jq '
            sort_by(
              (.os_version | gsub("A"; "") | tonumber) * -1,
              .model
            )
          ')
          
          if [ "$count" -eq 0 ]; then
            echo "::error::No config files found for op_model='$input' and op_target_model='${target_model:-<empty>}' after applying filters!"
            echo ""
            echo "Available configurations:"
            jq -r '.[] | "  - \(.model) (\(.os_version), \(.android_version)-\(.kernel_version))"' matrix.json
            exit 1
          fi
          
          echo "$filtered" | jq '.' > matrix.json
          echo "$ksu_options_normalized" > ksu_temp.json
          
          merged_matrix=$(jq -n \
            --slurpfile devices matrix.json \
            --slurpfile ksu_list ksu_temp.json \
            '[ $devices[0][] as $dev | $ksu_list[0][] as $ksu | ($dev + {ksu_type: $ksu.type, ksu_hash: $ksu.hash}) ]')
          
          rm ksu_temp.json
          final_count=$(echo "$merged_matrix" | jq 'length')
          
          echo "✅ Found $final_count device(s) to build"
          echo ""
          echo "Selected devices:"
          jq -r '.[] | "  - \(.model) (\(.os_version), \(.android_version)-\(.kernel_version), \(.ksu_type) - \(.ksu_hash))"' <<<"$merged_matrix"
          
          echo "count=$count" >> "$GITHUB_OUTPUT"
          
          ksu_type=$(echo "$ksu_options_normalized" | jq -r '.[0].type')
          ksu_ref=$(echo "$ksu_options_normalized" | jq -r '.[0].hash')
          
          KSU_REPO_OWNER="SukiSU-Ultra"
          KSU_REPO_NAME="SukiSU-Ultra"
          
          HEAD_REF="refs/heads/${ksu_ref}"
          TAG_REF="refs/tags/${ksu_ref}"
          
          QUERY='query($owner: String!, $name: String!, $headRef: String!, $tagRef: String!, $objRef: String!) {
            repository(owner: $owner, name: $name) {
              hb: ref(qualifiedName: $headRef) { t: target { ... on Commit { o: oid } } }
              ht: ref(qualifiedName: $tagRef) { t: target { ... on Commit { o: oid } } }
              ho: object(expression: $objRef) { ... on Commit { o: oid } }
            }
          }'
          
          MAX_RETRIES=3
          RETRY_COUNT=0
          RETRY_DELAY=5 # Seconds to wait between retries
          
          echo "Resolving $ksu_type hash ($ksu_ref)..."
          
          until [ $RETRY_COUNT -ge $MAX_RETRIES ]; do
            RESULT=$(gh api graphql -f query="$QUERY" -f owner="$KSU_REPO_OWNER" -f name="$KSU_REPO_NAME" -f headRef="$HEAD_REF" -f tagRef="$TAG_REF" -f objRef="$ksu_ref" 2>/dev/null)
            EXIT_CODE=$?
            
            if [ $EXIT_CODE -eq 0 ] && [ ! -z "$RESULT" ]; then
              echo "  ✅ API Success"
              break
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "::warning::API failed (Attempt $RETRY_COUNT/$MAX_RETRIES). Retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done
          
          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "::error::GitHub API unreachable. Cannot validate $ksu_ref"
            exit 1
          fi
          
          resolved_sha=$(echo "$RESULT" | jq -r '.data.repository | (.hb.t.o // .ht.t.o // .ho.o // "unknown")')
          
          if [ "$resolved_sha" == "unknown" ]; then
            echo "::error::Ref/Hash '$ksu_ref' does not exist in $KSU_REPO_OWNER/$KSU_REPO_NAME"
            exit 1
          fi
          
          echo "  ✅ Resolved: $ksu_type/$ksu_ref → $resolved_sha"
          echo "ksu_resolved_hash=$resolved_sha" >> "$GITHUB_OUTPUT"
          
          merged_matrix=$(echo "$merged_matrix" | jq  --arg resolved_sha "$resolved_sha" 'map(.ksu_resolved_hash = $resolved_sha)')
          
          mapfile -t active_keys < <(
            echo "$merged_matrix" \
              | jq -r '.[] | select(.susfs == true) | "\(.android_version)-\(.kernel_version)"' \
              | sort -u
          )
          echo "🔍 SUSFS enabled for: ${active_keys[*]:-none}"
          active_gki_keys_csv=$(IFS=','; echo "${active_keys[*]:-}")
          echo "active_gki_keys=$active_gki_keys_csv" >> "$GITHUB_OUTPUT"

          merged_matrix=$(echo "$merged_matrix" | jq '
            sort_by(
              (.os_version | gsub("A"; "") | tonumber? // 0) * -1,
              .model
            )
          ')
          
          echo "$merged_matrix" > final_matrix_temp.json
          
          wrapped=$(jq --slurp '{ include: .[] }' final_matrix_temp.json)
          echo "matrix=$(echo "$wrapped" | jq -c .)" >> "$GITHUB_OUTPUT"
          rm final_matrix_temp.json
          echo "::endgroup::"

      - name: Upload build matrix
        uses: actions/upload-artifact@v7
        with:
          name: build-matrix
          path: matrix.json
          archive: false
          retention-days: 7

      - name: 📊 Build plan summary
        run: |
          ksu_type="${{ fromJSON(steps.set-matrix.outputs.ksu_options_normalized)[0].type }}"
          ksu_ref="${{ fromJSON(steps.set-matrix.outputs.ksu_options_normalized)[0].hash }}"
          
          ksu_display=""
          if [[ "$ksu_ref" =~ ^[0-9a-f]{40}$ ]]; then
            ksu_display+="📌 \`$ksu_type\`, \`$ksu_ref\`"
          else
            ksu_display+="🔀 \`$ksu_type\`, \`$ksu_ref\` (\`${{ steps.set-matrix.outputs.ksu_resolved_hash }}\`)"
          fi
          
          build_ts_input="${{ inputs.build_timestamp }}"
          if [ -z "$build_ts_input" ]; then
            build_ts_display="⏱️ auto (current build time)"
          else
            build_ts_display="📌 \`$build_ts_input\`"
          fi
          
          {
            echo "## 🎯 Build Plan"
            echo ""
            echo "> **${{ inputs.op_model }}** · **${{ steps.set-matrix.outputs.count }}** device(s) · KSU \`$ksu_type\` · \`${{ inputs.optimize_level }}\`${{ inputs.make_release && ' · 📦 release' || '' }}"
            echo ""
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| 🎯 Target | \`${{ inputs.op_model }}\` · model \`${{ inputs.op_target_model != '' && inputs.op_target_model || 'all' }}\` · **${{ steps.set-matrix.outputs.count }}** device(s) |"
            echo "| 🧩 KSU | $ksu_display |"
            echo "| ⏱️ Timestamp | $build_ts_display |"
            echo "| ⚙️ Optimization | \`${{ inputs.optimize_level }}\` |"
            echo "| 🧹 Clean build (no ccache) | ${{ inputs.clean_build && '✅' || '❌' }} |"
            echo "| 📦 Create release | ${{ inputs.make_release && '✅' || '❌' }} |"
            echo "| 🔄 Toolchain sync | ${{ (inputs.mirror_toolchains || inputs.make_release) && '✅' || '❌' }}${{ (!inputs.mirror_toolchains && inputs.make_release) && ' · auto for release' || '' }} |"
            echo "| 🧰 ADIOS · Debug artifacts | ${{ inputs.enable_adios && '✅' || '❌' }} · ${{ inputs.debug && '✅' || '❌' }} |"
            echo ""
            echo ""
            echo "**Defaults:** ✅ SukiSU builtin · ✅ KPM · ✅ SUSFS · ❌ BBG · ❌ NoMount"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **💡 Note:** Hashes are resolved at run time via API calls before builds start." >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ inputs.op_model }}" == android*-*.* ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> **ℹ️ Android-Kernel Filter:** matching devices from A14, A15 and A16 will be built for \`${{ inputs.op_model }}\`" >> $GITHUB_STEP_SUMMARY
          fi

  mirror_toolchain:
    needs: set-op-model
    if: ${{ inputs.mirror_toolchains || inputs.make_release }}
    uses: ./.github/workflows/mirror-toolchains.yml
    secrets: inherit

  prepare_ccache:
    name: Prepare ccache binary (download once)
    runs-on: ubuntu-latest
    steps:
      - name: Download custom ccache once
        run: |
          set -uo pipefail
          echo "::group::Download ccache"
          url="https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/ccache/ccache-x86-64"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if curl -LfsS --connect-timeout 30 --max-time 120 -H "User-Agent: Mozilla/5.0" "$url" -o ccache && [ -s ccache ]; then
              ok=1; break
            fi
            echo "attempt $attempt failed (GitHub raw 504/throttle); backing off..."
            sleep $(( attempt * 5 + RANDOM % 6 ))
          done
          if [ "$ok" = 1 ]; then
            echo "✅ downloaded ccache once for all matrix jobs"
          else
            echo "::warning::custom ccache download failed; matrix jobs will fall back to the apt ccache"
            rm -f ccache
          fi
          echo "::endgroup::"
      - name: Upload ccache artifact
        uses: actions/upload-artifact@v7
        with:
          name: ccache-binary
          path: ccache
          retention-days: 1
          if-no-files-found: warn

  build:
    name: build (${{ matrix.model }}, ${{ matrix.soc }}, ${{ matrix.branch }}, ${{ matrix.manifest }}, ${{ matrix.android_version }}, ${{ matrix.kernel_version }}, ${{ matrix.os_version }}, ${{ matrix.ksu_type }})
    needs: [set-op-model, mirror_toolchain, prepare_ccache]
    if: |
      !cancelled() &&
      needs.set-op-model.result == 'success' &&
      (needs.mirror_toolchain.result == 'success' || needs.mirror_toolchain.result == 'skipped')
    timeout-minutes: 90
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-op-model.outputs.matrix) }}
    outputs:
      ksun_ver: ${{ steps.build-stat.outputs.ksu_version }}
      ksu_ver: ${{ steps.build-stat.outputs.ksu_version }}
    env:
      OP_TOTAL_DEVICES: ${{ needs.set-op-model.outputs.device_count }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 🧹 Emergency Disk Cleanup
        if: ${{ matrix.disk_cleanup }}
        uses: ./.github/actions/disk-cleanup

      - name: Install Minimal Dependencies
        run: |
          set -euo pipefail
          echo "::group::Install dependencies"
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o DPkg::Lock::Timeout=120"
          apt_try() {
            n=0
            until timeout 300 sudo DEBIAN_FRONTEND=noninteractive apt-get $APT_OPTS "$@"; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then
                echo "::error::apt-get $1 failed after $n attempts"
                return 1
              fi
              echo "apt-get $1 failed or stalled, retry $n/3"
              sleep 15
            done
          }
          # The runner image ships third-party apt sources (Chrome, Microsoft)
          # that this build needs nothing from -- every package below is Ubuntu's.
          # apt-get update fails HARD when any one of them serves an index its own
          # Release file disagrees with, and that is not transient, so the retry
          # above cannot clear it: on 2026-09-09 Google published a Chrome index
          # with a "Hash Sum mismatch" and every one of the 69 device jobs in a
          # release run died here, before ccache, before the kernel, before KSU.
          # Match on the host, not the filename: the image uses both .list and
          # deb822 .sources, and the names have changed before.
          for _src in /etc/apt/sources.list.d/*; do
            [ -f "$_src" ] || continue
            if grep -qE 'dl\.google\.com|packages\.microsoft\.com' "$_src"; then
              echo "  dropping third-party apt source: $(basename "$_src")"
              sudo rm -f "$_src"
            fi
          done
          apt_try update -qq
          apt_try install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix kmod libdw-dev elfutils pigz aria2
          sudo apt-get clean
          echo "✅ Dependencies installed"
          echo "::endgroup::"

      - name: Get prebuilt ccache (downloaded once by prepare_ccache)
        uses: actions/download-artifact@v8
        with:
          name: ccache-binary
          path: ccache-dl
        continue-on-error: true

      - name: Install ccache (ECS by cctv18, shared via artifact)
        run: |
          set -uo pipefail
          echo "::group::Install ccache"
          if [ -s ccache-dl/ccache ]; then
            sudo cp -f ccache-dl/ccache /usr/bin/ccache
            sudo chmod +x /usr/bin/ccache
            echo "✅ installed custom ccache from shared artifact"
          else
            echo "::warning::shared ccache artifact unavailable; using apt ccache"
          fi
          rm -rf ccache-dl
          echo "[DEBUG] Ccache version : $(ccache --version | head -1)"
          echo "::endgroup::"

      - name: ♻️ Configure ccache (bounded)
        run: |
          echo "::group::Configure ccache environment"
          set -euo pipefail
          if command -v ccache >/dev/null 2>&1; then
            CACHE_DIR="${{ github.workspace }}/.ccache"
            CCACHE_LOG="${{ github.workspace }}/ccache.log"
            mkdir -p "$CACHE_DIR"
            
            SETTINGS=(
              "CCACHE_DIR=$CACHE_DIR"
              "CCACHE_MAXSIZE=12G"
              "CCACHE_COMPILERCHECK=content"
              "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
              "CCACHE_NOHASHDIR=true"
              "CCACHE_IGNOREOPTIONS=--sysroot*"
              "CCACHE_COMPRESSION=true"
              "CCACHE_COMPRESSION_LEVEL=3"
              "CCACHE_DIRECT=true"
              "CCACHE_FILE_CLONE=true"
              "CCACHE_NOINODECACHE=true"
              "CCACHE_IS_KERNEL_COMPILING=true"
              "CCACHE_UMASK=002"
              "CCACHE_SLOPPINESS=file_macro,time_macros,pch_defines,system_headers,locale"
            )
            
            for setting in "${SETTINGS[@]}"; do
              export "$setting"
              echo "$setting" >> "$GITHUB_ENV"
            done
            
            if [ "${{ inputs.debug }}" == "true" ]; then
              export "CCACHE_LOGFILE=$CCACHE_LOG"
              echo "CCACHE_LOGFILE=$CCACHE_LOG" >> "$GITHUB_ENV"
            fi
            
            if ccache --help 2>&1 | grep -q 'depend_mode'; then
              export CCACHE_DEPEND=true
              echo "CCACHE_DEPEND=true" >> "$GITHUB_ENV"
            fi
            
            echo "✅ ccache configured successfully"
            echo "Current ccache configuration:"
            ccache -p
          else
            echo "ccache not found, skipping configuration."
          fi
          echo "::endgroup::"

      - name: 🧹 Prepare op_config_json (without KSU fields)
        id: prepare_config
        shell: bash
        run: |
          echo "config_json=$(jq -nc --argjson m '${{ toJSON(matrix) }}' '$m | del(.ksu_type, .ksu_hash, .ksu_resolved_hash)')" >> "$GITHUB_OUTPUT"

      - name: 🔨 Build Kernel
        id: build
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ steps.prepare_config.outputs.config_json }}
          ksu_type: ${{ matrix.ksu_type }}
          ksu_branch_or_hash: ${{ matrix.ksu_resolved_hash }}
          optimize_level: ${{ inputs.optimize_level || 'O2' }}
          build_timestamp: ${{ inputs.build_timestamp || '' }}
          enable_adios: ${{ inputs.enable_adios || false }}
          patches_ref: ${{ inputs.patches_ref || 'main' }}
          clean: ${{ inputs.clean_build || false }}
          debug: ${{ inputs.debug || false }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Build statistics
        id: build-stat
        if: always()
        run: |
          echo "::group::Build Statistics"
          
          echo "Device: ${{ matrix.model }}"
          echo "OS Version: ${{ matrix.os_version }}"
          echo "Kernel: ${{ matrix.android_version }}-${{ matrix.kernel_version }}"
          echo "Status: ${{ job.status }}"
          
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo ""
            echo "✅ Build completed successfully"
            echo ""
            echo "Outputs:"
            echo "  - Kernel: ${{ steps.build.outputs.kernel_version }}"
            echo "  - SukiSU: v${{ steps.build.outputs.ksu_version }}"
            echo "  - SUSFS: ${{ steps.build.outputs.susfs_version }}"
            echo "  - KPM: ${{ matrix.kpm }}"
            echo "ksun_ver=" >> "$GITHUB_OUTPUT"
            echo "ksu_ver=${{ steps.build.outputs.ksu_version }}" >> "$GITHUB_OUTPUT"
            echo "  - Build time: ${{ steps.build.outputs.build_time }}s"
            
            if [ "${{ inputs.clean_build }}" != "true" ]; then
              echo "  - ccache hit rate: ${{ steps.build.outputs.ccache_hit_rate }}"
              echo "  - ccache direct rate: ${{ steps.build.outputs.ccache_direct_rate }}"
            else
              echo "  - ccache: disabled (clean build)"
            fi
            
            if [ -n "${{ steps.build.outputs.warnings }}" ]; then
              echo "  - Warnings: ${{ steps.build.outputs.warnings }}"
            fi
          else
            echo "❌ Build failed"
          fi
          
          echo "::endgroup::"

      - name: 📝 Job summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          
          ### ${{ matrix.model }} (${{ matrix.os_version }}) - ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}
          
          **Kernel:** ${{ matrix.android_version }}-${{ matrix.kernel_version }}
          EOF
          
          
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            cat >> $GITHUB_STEP_SUMMARY << EOF
          | Metric | Value |
          |--------|-------|
          | **Kernel** | ${{ steps.build.outputs.kernel_version }} |
          EOF
            cat >> $GITHUB_STEP_SUMMARY << EOF
          | **SukiSU** | v${{ steps.build.outputs.ksu_version }} |
          | **SUSFS** | ${{ steps.build.outputs.susfs_version }} |
          | **KPM** | ${{ matrix.kpm }} |
          EOF
          cat >> $GITHUB_STEP_SUMMARY << EOF
          | **Build Time** | ${{ steps.build.outputs.build_time }}s |
          EOF
            
            if [ "${{ inputs.clean_build }}" != "true" ]; then
              cat >> $GITHUB_STEP_SUMMARY << EOF
          | **ccache Hit Rate** | ${{ steps.build.outputs.ccache_hit_rate }} |
          | **ccache Direct Rate** | ${{ steps.build.outputs.ccache_direct_rate }} |
          EOF
            fi
            
            if [ -n "${{ steps.build.outputs.warnings }}" ]; then
              echo "| **Warnings** | ${{ steps.build.outputs.warnings }} |" >> $GITHUB_STEP_SUMMARY
            fi
            
            cat >> $GITHUB_STEP_SUMMARY << EOF
          
          **Image SHA256:** \`${{ steps.build.outputs.image_sha256 }}\`
          **AnyKernel3 Zip SHA256:** \`${{ steps.build.outputs.zip_sha256 }}\`
          EOF
          fi

      - name: 🧹 Final cleanup and space report
        if: always()
        run: |
          echo "::group::Cleanup"
          
          sudo rm -rf "$GITHUB_WORKSPACE/out" || true
          sudo rm -rf "$GITHUB_WORKSPACE/build" || true
          sudo rm -rf "$GITHUB_WORKSPACE/kernel/out" || true
          sudo rm -rf "$GITHUB_WORKSPACE/.repo" || true
          sudo rm -rf /tmp/* || true
          
          if command -v ccache >/dev/null 2>&1; then
            echo ""
            echo "📊 ccache statistics after build:"
            ccache -s
            echo ""
            echo "💾 ccache preserved for next build"
          fi
          
          echo ""
          echo "💽 Final disk usage:"
          df -h /
          
          echo "::endgroup::"

  build_report:
    name: 📋 Build report
    needs: [set-op-model, build]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Summarize build results
        run: |
          set -uo pipefail
          jobs="$(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name|startswith("build (")) | "\(.conclusion)\t\(.name)"')"

          total=$(printf '%s\n' "$jobs" | grep -c . || true)
          ok=$(printf '%s\n'    "$jobs" | grep -c   '^success' || true)
          bad=$(printf '%s\n'   "$jobs" | grep -cvE '^success' || true)

          {
            echo "## 📋 Build Report"
            echo ""
            echo "**✅ ${ok} succeeded · ❌ ${bad} failed · ${total} total**"
            if [ "${bad:-0}" -gt 0 ]; then
              echo ""
              echo "### ❌ Failed / cancelled"
              echo ""
              echo "| Device | Result |"
              echo "|--------|--------|"
              printf '%s\n' "$jobs" | grep -vE '^success' | while IFS=$'\t' read -r concl name; do
                dev=$(printf '%s' "$name" | sed -E 's/^build \(([^,]+),[^,]+,[^,]+,[^,]+, *([^,]+), *([^,]+), *([^,]+),.*/\1 (\2-\3, \4)/')
                echo "| \`${dev}\` | ${concl:-unknown} |"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  trigger-release:
    name: 📦 Create release
    needs: [set-op-model, build]
    runs-on: ubuntu-latest
    if: |
      !cancelled() &&
      inputs.make_release == true &&
      needs.build.result == 'success' &&
      needs.set-op-model.result == 'success'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          merge-multiple: true
          skip-decompress: true

      - name: 📝 Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          MATRIX_FILE="./downloaded-artifacts/matrix.json"
          if [ ! -s "$MATRIX_FILE" ]; then
            echo "::error::Build matrix artifact is missing"
            exit 1
          fi

          total="$(jq 'length' "$MATRIX_FILE")"
          a14="$(jq '[.[] | select(.os_version == "A14")] | length' "$MATRIX_FILE")"
          a15="$(jq '[.[] | select(.os_version == "A15")] | length' "$MATRIX_FILE")"
          a16="$(jq '[.[] | select(.os_version == "A16")] | length' "$MATRIX_FILE")"
          
          mapfile -d '' assets < <(find ./downloaded-artifacts -maxdepth 1 -type f -name 'AK3_*.zip' -print0 | sort -z)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No AK3 kernel ZIPs were downloaded"
            exit 1
          fi
          
          cat > release_notes.md <<EOF
          # OnePlus SukiSU kernels
          
          Built from the restored A14, A15 and A16 configuration sets.
          
          | Setting | Value |
          |---------|-------|
          | Selected devices | $total |
          | A14 / A15 / A16 | $a14 / $a15 / $a16 |
          | Root implementation | SukiSU builtin |
          | KPM | Enabled |
          | SUSFS | Enabled |
          | BBG | Disabled |
          | NoMount | Disabled |
          | Installer | Non-interactive; no volume-key selection |
          
          ## Downloads
          EOF
          
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            sha="$(sha256sum "$asset" | awk '{print $1}')"
            printf -- '- %s — SHA256: %s\n' "$name" "$sha" >> release_notes.md
          done

          {
            echo "RELEASE_TAG=sukisu-susfs-r${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            echo "RELEASE_TITLE=SukiSU builtin + SUSFS + KPM · A14/A15/A16"
          } >> "$GITHUB_ENV"

      - name: 🚀 Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find ./downloaded-artifacts -maxdepth 1 -type f -name 'AK3_*.zip' -print0 | sort -z)
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md

      - name: 📊 Release summary
        shell: bash
        run: |
          {
            echo "## 🎉 Release created"
            echo ""
            echo "**$RELEASE_TITLE**"
            echo ""
            echo "Tag: $RELEASE_TAG"
            echo ""
            echo "Defaults: SukiSU builtin, KPM and SUSFS enabled; BBG and NoMount disabled; AK3 flashing is non-interactive."
          } >> "$GITHUB_STEP_SUMMARY"
